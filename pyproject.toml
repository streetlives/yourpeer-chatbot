[tool.ruff]
# Match the Python version the app is deployed under (render.yaml: 3.12.0).
target-version = "py312"

# Conventional 100-char limit — tighter than PEP 8's 79 but roomy enough
# for descriptive type hints and f-string messages.
line-length = 100

# Files to check. Test code follows the same standards as production code.
# Generated/vendored paths are excluded via .gitignore rather than here.

[tool.ruff.lint]
# Conservative initial rule set: real bugs, not style opinions. Rationale:
# this project had no linter before, so enabling every rule at once would
# generate thousands of violations across the existing codebase. Start
# narrow, expand as each new rule family is curated.
#
#   E    pycodestyle errors         — real issues (syntax, not just style)
#   F    pyflakes                   — unused imports, undefined names, etc.
#   W    pycodestyle warnings       — deprecated syntax, trailing whitespace
#
# Easy additions once the codebase is clean under the above:
#   I    isort                      — import sorting
#   UP   pyupgrade                  — modernize Python syntax
#   B    flake8-bugbear             — common bug patterns
#   C4   flake8-comprehensions      — clearer list/dict/set comprehensions
#   SIM  flake8-simplify            — simplifiable expressions
select = ["E", "F", "W"]

# Suppressions that the initial rule set tends to false-positive on.
# Revisit once more rule families are enabled.
ignore = [
    "E501",  # line too long — formatter will handle this later; noise in prose docstrings now
]

# Per-file relaxations. Tests intentionally shadow names, use bare asserts,
# and unused fixtures are common — no need to warn on them.
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["F401", "F811"]  # unused imports, redefinition
"scripts/**/*.py" = ["E402"]         # module-level imports not at top (some scripts set up sys.path first)


[tool.pytest.ini_options]
# pythonpath makes `from app.services...` resolve when pytest is run from
# the repo root. Without this, individual tests that don't go through
# conftest.py (e.g. `pytest tests/unit/test_X.py::test_Y`) can fail to
# import. conftest.py sets sys.path as a belt-and-suspenders fallback,
# but this setting is the canonical fix.
pythonpath = ["backend"]

# xfail_strict = true means an @pytest.mark.xfail test that actually
# PASSES fails the build (shows as XPASSED → FAILED). This is the
# signal we want: "hey, the feature this test was waiting on has
# landed — flip the xfail to a real passing test." Without strict,
# xpassed is silent and we lose the notification that a feature
# gap closed. There are 6 xfails currently (see tests/README.md and
# TEST_QUALITY_PLAN.md §2.1); when any of them starts passing, this
# setting tells us immediately.
xfail_strict = true

# Registered custom markers. Using an unregistered marker (e.g.
# @pytest.mark.slow) currently prints a deprecation warning; making
# it fail is a future step. Register here so typos become loud.
# Usage:
#   @pytest.mark.slow              — tests > 1s individually
#   @pytest.mark.requires_llm      — needs a real ANTHROPIC_API_KEY
#   @pytest.mark.requires_db       — needs a live DATABASE_URL
#   @pytest.mark.live              — integration with a real external service
# (Unit/integration split is by directory, not by marker.)
markers = [
    "slow: tests that take more than ~1 second",
    "requires_llm: tests that need a working ANTHROPIC_API_KEY",
    "requires_db: tests that need a live DATABASE_URL connection",
    "live: tests that hit real external services (not mocked)",
]
