name: Mutation Testing (PR)

# Per-PR incremental mutation testing. Runs cosmic-ray ONLY on the files
# the PR touches, cross-referenced against the critical-module allowlist.
#
# This is the "Google model" described in Petrović & Ivanković (TSE 2021):
# don't mutate the whole codebase — mutate only what changed. Fast enough
# to run on every PR for PRs that touch safety-critical code.
#
# If a PR doesn't touch any critical module, this workflow skips entirely.
#
# Multi-module parallelism: each changed critical module runs in its own
# parallel job (matrix-include). A PR that touches both classifier.py
# and orchestrator.py gets TWO parallel jobs, not one serial job that
# risks timing out on the second module (the PR 6 hang root cause).

on:
  pull_request:
    paths:
      # Only fires when a PR touches one of the critical modules.
      # Edit this list as priorities change. Keep it small — mutation
      # testing on a PR should be a last-line quality check for
      # high-stakes code, not a routine gate.
      - "backend/app/services/crisis_detector.py"
      - "backend/app/services/classifier.py"
      - "backend/app/privacy/pii_redactor.py"
      - "backend/app/services/chatbot/orchestrator.py"
      - "backend/app/services/session_token.py"

jobs:
  # Stage 1: figure out which critical modules this PR changed, and emit
  # a matrix JSON for stage 2. This runs fast (no Python setup needed)
  # and outputs zero rows if no critical module changed → matrix jobs
  # skipped entirely.
  detect-changed-modules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      any-changed: ${{ steps.build-matrix.outputs.any-changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history to diff against the base branch.
          fetch-depth: 0

      - name: Build mutation matrix from changed files
        id: build-matrix
        run: |
          # Modules that need mutation testing when touched. Pairs each
          # module with its focused test subset + threshold. KEEP IN SYNC
          # with .github/workflows/mutation-testing.yml (weekly).
          declare -A TESTS_FOR_MODULE
          TESTS_FOR_MODULE["backend/app/services/crisis_detector.py"]="tests/unit/test_phrase_audit.py tests/unit/test_contraction_normalization.py tests/unit/test_frustration_and_crisis.py"
          TESTS_FOR_MODULE["backend/app/services/classifier.py"]="tests/integration/test_classification_and_routing.py tests/unit/test_contraction_normalization.py"
          TESTS_FOR_MODULE["backend/app/privacy/pii_redactor.py"]="tests/unit/test_pii_redactor.py"
          TESTS_FOR_MODULE["backend/app/services/chatbot/orchestrator.py"]="tests/integration/test_classification_and_routing.py tests/integration/test_multi_turn_and_context.py"
          TESTS_FOR_MODULE["backend/app/services/session_token.py"]="tests/unit/test_session_store.py tests/unit/test_main.py"

          declare -A THRESHOLD_FOR_MODULE
          THRESHOLD_FOR_MODULE["backend/app/services/crisis_detector.py"]=50
          THRESHOLD_FOR_MODULE["backend/app/services/classifier.py"]=70
          THRESHOLD_FOR_MODULE["backend/app/privacy/pii_redactor.py"]=85
          THRESHOLD_FOR_MODULE["backend/app/services/chatbot/orchestrator.py"]=70
          THRESHOLD_FOR_MODULE["backend/app/services/session_token.py"]=85

          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)

          # Build a JSON array of {module, tests, threshold, safe_name}
          # triples, one entry per changed critical module.
          matrix_entries=""
          for module in "${!TESTS_FOR_MODULE[@]}"; do
            if echo "$changed" | grep -qxF "$module"; then
              tests="${TESTS_FOR_MODULE[$module]}"
              threshold="${THRESHOLD_FOR_MODULE[$module]}"
              safe_name=$(echo "$module" | tr '/' '-')
              entry="{\"module\":\"$module\",\"tests\":\"$tests\",\"threshold\":$threshold,\"safe_name\":\"$safe_name\"}"
              if [ -z "$matrix_entries" ]; then
                matrix_entries="$entry"
              else
                matrix_entries="$matrix_entries,$entry"
              fi
            fi
          done

          if [ -z "$matrix_entries" ]; then
            echo "No critical modules changed — mutation matrix will be empty."
            echo "any-changed=false" >> $GITHUB_OUTPUT
            # Emit an empty-but-valid matrix so the downstream job skips
            # cleanly instead of erroring on malformed JSON.
            echo 'matrix={"include":[]}' >> $GITHUB_OUTPUT
          else
            echo "any-changed=true" >> $GITHUB_OUTPUT
            echo "matrix={\"include\":[$matrix_entries]}" >> $GITHUB_OUTPUT
            echo "Changed critical modules (will mutate in parallel):"
            echo "[$matrix_entries]" | python3 -m json.tool
          fi

  # Stage 2: one parallel job per changed module. Matrix-expanded from
  # stage 1's output. Each job gets its own 30-minute budget — the
  # slowest module determines wall-clock time, not the sum of all.
  #
  # Pre-fix (the PR 6 hang): classifier + orchestrator ran serially in
  # ONE 30-minute job. Classifier ate ~28 minutes; orchestrator hit the
  # timeout immediately after starting.
  #
  # Post-fix: each module gets its own 30-minute job. Classifier and
  # orchestrator each complete independently; total wall-clock is
  # bounded by the single slowest module.
  pr-mutation:
    needs: detect-changed-modules
    if: needs.detect-changed-modules.outputs.any-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Mutate ${{ matrix.safe_name }}

    strategy:
      fail-fast: false  # One module's failure shouldn't cancel the others.
      matrix: ${{ fromJson(needs.detect-changed-modules.outputs.matrix) }}

    env:
      SESSION_SECRET: test-session-secret-for-ci-only
      ADMIN_API_KEY: test-admin-key-for-ci-only
      DATABASE_URL: postgresql://test:test@localhost/test_ci

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov pytest-mock pytest-asyncio cosmic-ray

      - name: Run mutation testing for ${{ matrix.module }}
        run: |
          echo "::group::Mutating ${{ matrix.module }}"
          cat > cosmic-ray.toml <<EOF
          [cosmic-ray]
          module-path = "${{ matrix.module }}"
          timeout = 60
          excluded-modules = []
          test-command = "python -m pytest ${{ matrix.tests }} -x --tb=no -q"
          [cosmic-ray.distributor]
          name = "local"
          [cosmic-ray.interceptors]
          enabled = ["spor", "pragma_no_mutate", "operators-filter"]
          EOF

          rm -f cr-${{ matrix.safe_name }}.sqlite
          cosmic-ray init cosmic-ray.toml cr-${{ matrix.safe_name }}.sqlite
          cosmic-ray --verbosity WARNING baseline cosmic-ray.toml
          cosmic-ray exec cosmic-ray.toml cr-${{ matrix.safe_name }}.sqlite
          cr-report cr-${{ matrix.safe_name }}.sqlite | tail -20
          echo "::endgroup::"

          # Threshold check. Uses the per-module threshold captured in
          # the matrix entry; avoids repeating the THRESHOLDS dict here.
          python3 <<PY
          import sqlite3, sys
          threshold = ${{ matrix.threshold }}

          con = sqlite3.connect("cr-${{ matrix.safe_name }}.sqlite")
          cur = con.cursor()
          killed = cur.execute("SELECT COUNT(*) FROM work_results WHERE test_outcome='KILLED'").fetchone()[0]
          survived = cur.execute("SELECT COUNT(*) FROM work_results WHERE test_outcome='SURVIVED'").fetchone()[0]
          total = killed + survived
          if total == 0:
              print("WARN: no mutants ran for ${{ matrix.module }}")
              sys.exit(0)
          score = 100 * killed / total
          print(f"${{ matrix.module }}: {score:.1f}% ({killed}/{total}) threshold={threshold}%")
          if score < threshold:
              print(f"::error file=${{ matrix.module }}::Mutation score {score:.1f}% below threshold {threshold}%")
              sys.exit(1)
          PY

      - name: Upload mutation report for ${{ matrix.safe_name }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Unique per-module artifact name. Pre-fix used a single shared
          # name ("pr-mutation-reports"), which causes a second matrix
          # cell to overwrite the first on upload.
          name: pr-mutation-report-${{ matrix.safe_name }}
          path: cr-${{ matrix.safe_name }}.sqlite
          retention-days: 14
